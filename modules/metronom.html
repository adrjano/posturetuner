<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PostureTuner">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B130E">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>Metronom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#1B130E;
    --wood-mid:#3A2A1E;
    --panel:#1E2226;
    --panel-2:#2E3538;
    --cream:#FFFFFF;
    --cream-2:#2E3538;
    --gold:#C56A3B;
    --active-text:#1A1310;
    --ok:#3ECF7E;
    --ok-bg:rgba(62,207,126,0.16);
    --bad:#F2564A;
    --bad-bg:rgba(242,86,74,0.16);
    --ink:#FFFFFF;
    --ink-soft:#B7C2C6;
    --radius:18px;
    --dot-normal:#E8B93E;
    --dot-accent:#E2793A;
    --pend-line:#FFFFFF;
    --warn:#F0B429;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#14171A;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:18px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  header{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; }
  h1{ font-family:'Fraunces',serif; font-optical-sizing:auto; font-weight:700; font-size:clamp(30px,7vw,42px); margin:0; color:var(--cream); letter-spacing:-0.01em; }
  h1 span{color:var(--gold);}

  @media (max-width:480px){
    .wrap{ padding-left:10px; padding-right:10px; }
  }

  .btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:16px; border:none; border-radius:999px; padding:11px 20px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  .btn-primary{ background:var(--gold); color:var(--active-text); }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(201,162,39,.6);}
  .btn-ghost{ background:transparent; border:1.5px solid rgba(246,241,231,.5); color:var(--cream); }

  .mode-switch{
    display:flex; gap:6px; background:var(--panel); padding:6px; border-radius:16px; margin-bottom:14px; width:fit-content;
    border:1px solid var(--panel-2); flex-wrap:wrap;
  }
  .mode-switch button{
    border:none; background:transparent; padding:10px 18px; border-radius:999px; font-weight:600; font-size:15.5px; cursor:pointer; color:var(--ink-soft);
  }
  .mode-switch button.active{ background:var(--gold); color:var(--active-text); box-shadow:0 2px 10px -2px rgba(0,0,0,.35); }

  .theme-picker{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; padding:10px; background:var(--panel);
    border:1px solid var(--panel-2); border-radius:14px; width:fit-content;
  }
  .theme-picker.hidden{ display:none; }
  .theme-swatch{ display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:4px; }
  .theme-swatch .chip{ width:40px; height:40px; border-radius:10px; border:2px solid transparent; display:flex; overflow:hidden; }
  .theme-swatch .chip span{ flex:1; height:100%; }
  .theme-swatch.active .chip{ border-color:var(--cream); }
  .theme-swatch .label{ font-size:11px; color:var(--ink-soft); max-width:60px; text-align:center; line-height:1.2; }

  .card{ background:var(--panel); border-radius:var(--radius); padding:20px 18px; box-shadow:0 10px 26px -18px rgba(0,0,0,0.5); border:1px solid var(--panel-2); margin-bottom:14px; }
  .card h3{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0 0 12px; color:var(--cream); text-align:center; }

  /* BPM display */
  .bpm-stage{ text-align:center; }
  .bpm-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .bpm-step-col{ display:flex; flex-direction:column; gap:10px; flex:none; }
  .bpm-display-col{ flex:1; min-width:0; padding-top:4px; }
  .bpm-display{ display:flex; align-items:baseline; justify-content:center; gap:8px; }
  .bpm-number{ font-family:'Inter',sans-serif; font-weight:700; font-size:clamp(46px, 13vw, 62px); color:var(--cream); line-height:1; letter-spacing:-0.02em; }
  .bpm-unit{ font-size:16px; color:var(--ink-soft); font-weight:600; }
  .tempo-label{ font-size:14.5px; color:var(--gold); font-weight:700; margin-top:4px; letter-spacing:.02em; text-transform:uppercase; }

  .bpm-step-btn{
    width:54px; height:54px; border-radius:50%; border:none; background:var(--panel-2); color:var(--cream);
    font-size:18px; font-family:'Inter',sans-serif; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .bpm-step-btn:active{ background:var(--gold); color:var(--active-text); }
  .bpm-slider{ width:100%; accent-color:var(--gold); height:6px; margin-top:22px; }

  .tap-row{ margin-top:16px; display:flex; justify-content:center; }
  .tap-btn{
    background:var(--panel-2); color:var(--cream); border:none; border-radius:14px; padding:12px 26px;
    font-weight:700; font-size:15.5px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .tap-btn:active{ background:var(--gold); color:var(--active-text); }

  /* Beat dots - clickable, cycle through normal / accent / muted; light up as the beat counts */
  .beat-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:6px 0 16px; }
  .beat-dot{
    position:relative; width:30px; height:30px; border-radius:50%; border:none; padding:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer;
    transition:transform .12s ease; -webkit-tap-highlight-color:transparent;
  }
  .beat-dot.state-normal{ background:var(--dot-normal); }
  .beat-dot.state-accent{ background:var(--dot-accent); }
  .beat-dot.state-muted{ background:var(--panel-2); opacity:.5; }
  .beat-dot.state-muted::after{
    content:''; position:absolute; width:150%; height:2px; background:var(--bad); transform:rotate(45deg);
  }
  .beat-dot.active{ transform:scale(1.28); box-shadow:0 0 0 5px rgba(255,255,255,.2); }

  /* Pendulum - ball flies along a thick white line and bounces off a wall at each end */
  .pendulum-track{ position:relative; height:46px; width:100%; margin:20px auto 22px; --wall:9px; --ball:30px; }
  .pendulum-track::before{
    content:''; position:absolute; left:var(--wall); right:var(--wall); top:50%; height:6px;
    background:var(--pend-line); border-radius:3px; transform:translateY(-50%);
  }
  .pend-wall{ position:absolute; top:0; bottom:0; width:var(--wall); background:var(--pend-line); border-radius:4px; }
  .pend-wall.left{ left:0; }
  .pend-wall.right{ right:0; }
  .pend-wall.hit{ animation:wallHit .22s ease-out; }
  @keyframes wallHit{
    0%{ background:var(--gold); box-shadow:0 0 14px 4px var(--gold); transform:scaleX(1.5); }
    100%{ background:var(--pend-line); box-shadow:0 0 0 0 transparent; transform:scaleX(1); }
  }
  .pendulum-dot{
    position:absolute; top:50%; width:var(--ball); height:var(--ball); border-radius:50%;
    left:calc(var(--wall) + (100% - 2 * var(--wall) - var(--ball)) * var(--x, 0));
    background:var(--bad); transform:translateY(-50%);
    box-shadow:0 6px 14px -6px rgba(0,0,0,.5); transition:opacity .15s ease;
  }

  /* Uderzenia/takt + Kliknięcia side by side */
  .settings-row{ display:flex; gap:14px; }
  .settings-card{ flex:1; min-width:0; }
  .select-field{
    width:100%; background:var(--panel-2); color:var(--cream); border:1px solid var(--panel-2);
    border-radius:12px; padding:12px 14px; font-family:'Inter',sans-serif; font-weight:700; font-size:16px;
    cursor:pointer; text-align:center; appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 22px) center, calc(100% - 16px) center;
    background-size:6px 6px,6px 6px; background-repeat:no-repeat;
  }

  /* Play button */
  .play-stage{ display:flex; justify-content:center; margin:8px 0 10px; }
  .play-btn{
    width:96px; height:96px; border-radius:50%; border:none; cursor:pointer;
    background:var(--gold); color:var(--active-text); font-size:34px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 30px -14px rgba(0,0,0,.55);
    transition:transform .12s ease;
  }
  .play-btn:active{ transform:scale(.94); }
  .play-btn.playing{ background:var(--bad); color:#fff; }

  [hidden]{ display:none !important; }

  /* Rhythm game */
  .pulse-overlay{
    position:fixed; inset:0; z-index:40; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, transparent 35%, var(--gold) 150%);
    box-shadow:inset 0 0 90px 30px var(--gold);
  }
  .pulse-overlay.go{ animation:pulseGlow .12s ease-out; }
  @keyframes pulseGlow{ 0%{ opacity:0; } 25%{ opacity:.38; } 100%{ opacity:0; } }

  .game-card h3{ margin-bottom:14px; }
  .game-fields{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .game-field{ display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:600; color:var(--ink-soft); text-align:center; }
  .switch-row{ display:flex; align-items:center; justify-content:center; gap:10px; font-size:15.5px; font-weight:600; color:var(--cream); cursor:pointer; }
  .switch-row input{ width:22px; height:22px; accent-color:var(--gold); }
  .game-hint{ margin:6px 0 14px; font-size:12.5px; line-height:1.4; color:var(--ink-soft); text-align:center; }
  .game-btn{ width:100%; }
  .game-msg{ margin:10px 0 0; font-size:14px; font-weight:600; color:var(--bad); text-align:center; }
  .game-msg:empty{ display:none; }
  .game-stage{ text-align:center; }
  .game-stage .pendulum-track{ margin:12px auto 10px; }
  .game-status{ min-height:30px; font-size:21px; font-weight:700; color:var(--gold); }
  .game-counter{ min-height:70px; font-family:'Fraunces',serif; font-weight:700; font-size:64px; line-height:70px; color:var(--cream); margin-bottom:12px; }
  .game-counter.test{ color:var(--bad); }
  .game-result{ text-align:center; }
  .result-score{ display:flex; align-items:center; justify-content:center; gap:14px; font-family:'Fraunces',serif; font-weight:700; font-size:76px; line-height:1.05; color:var(--gold); }
  .result-emoji{ font-size:62px; line-height:1; }
  .result-trophy{ height:76px; width:auto; display:block; }
  .result-text{ margin:6px 0 14px; font-size:16px; font-weight:600; color:var(--cream); }
  .result-text:empty{ display:none; }
  .chart svg{ width:100%; height:auto; display:block; }
  .chart-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:center; margin:8px 0 16px; font-size:12.5px; color:var(--ink-soft); }
  .chart-legend .lg{ display:inline-flex; align-items:center; gap:6px; }
  .lg i{ display:inline-block; }
  .lg .t-grid{ width:5px; height:16px; background:var(--gold); border-radius:1px; }
  .lg .t-clap{ width:11px; height:11px; border-radius:50%; background:var(--ink); }
  .nick-box{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .nick-box label{ font-size:13.5px; font-weight:600; color:var(--ink-soft); text-align:center; }
  .nick-input{
    width:100%; background:var(--panel-2); color:var(--cream); border:1px solid var(--panel-2); border-radius:12px;
    padding:12px 14px; font-family:'Inter',sans-serif; font-weight:700; font-size:16px; text-align:center;
  }
  .nick-input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .board{ margin-top:22px; padding-top:16px; border-top:1px solid var(--panel-2); }
  .board-title{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 10px; text-align:center; color:var(--cream); }
  .board-row{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px; font-size:15.5px; }
  .board-row:nth-child(odd){ background:var(--panel-2); }
  .board-row.me{ outline:2px solid var(--gold); }
  .board-rank{ width:24px; font-weight:700; color:var(--ink-soft); }
  .board-nick{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .board-score{ font-weight:700; color:var(--gold); }
  .board-empty{ text-align:center; font-size:14px; color:var(--ink-soft); margin:6px 0; }
  .board-actions{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:14px; }
  .board-actions .btn{ font-size:14px; padding:9px 18px; }
  .board-confirm{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; font-size:14px; }
  .board-confirm-btns{ display:flex; gap:10px; }
  .btn-danger{ background:var(--bad); color:#fff; }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="title">Metronom</h1>
  </header>

  <div class="mode-switch" style="display:none">
    <button id="themeBtn" title="Wypróbuj inne kolory">🎨 Motyw</button>
  </div>
  <div class="theme-picker hidden" id="themePicker" style="display:none"></div>

  <div class="card">
    <div class="beat-row" id="beatRow"></div>
    <div class="pendulum-track" id="mainTrack">
      <div class="pend-wall left"></div>
      <div class="pend-wall right"></div>
      <div class="pendulum-dot"></div>
    </div>
    <div class="play-stage">
      <button class="play-btn" id="playBtn">▶</button>
    </div>
  </div>

  <div class="card bpm-stage">
    <div class="bpm-top">
      <div class="bpm-step-col">
        <button class="bpm-step-btn" id="bpmMinus1" title="-1">−1</button>
        <button class="bpm-step-btn" id="bpmMinus5" title="-5">−5</button>
      </div>
      <div class="bpm-display-col">
        <div class="bpm-display">
          <span class="bpm-number" id="bpmNumber">100</span>
          <span class="bpm-unit">BPM</span>
        </div>
        <div class="tempo-label" id="tempoLabel">Moderato</div>
      </div>
      <div class="bpm-step-col">
        <button class="bpm-step-btn" id="bpmPlus1" title="+1">+1</button>
        <button class="bpm-step-btn" id="bpmPlus5" title="+5">+5</button>
      </div>
    </div>

    <input type="range" class="bpm-slider" id="bpmSlider" min="30" max="250" value="100">

    <div class="tap-row">
      <button class="tap-btn" id="tapBtn">👆 TAP</button>
    </div>
  </div>

  <div class="settings-row">
    <div class="card settings-card">
      <h3 data-i18n="beatsPerBar">Uderzenia/takt</h3>
      <select class="select-field" id="beatsPerBarSelect"></select>
    </div>
    <div class="card settings-card">
      <h3 data-i18n="clicks">Kliknięcia</h3>
      <select class="select-field" id="subdivisionSelect"></select>
    </div>
  </div>

  <div class="card game-card">
    <h3 data-i18n="gameTitle">Gra rytmiczna</h3>

    <div id="gameSetup">
      <div class="game-fields">
        <label class="game-field"><span data-i18n="gameTempo">Tempo</span>
          <select class="select-field" id="gameTempoSelect"></select></label>
        <label class="game-field"><span data-i18n="gameMode">Tryb</span>
          <select class="select-field" id="gameModeSelect">
            <option value="adv" data-i18n="modeAdv">Zaawansowany</option>
            <option value="beg" data-i18n="modeBeg">Początkujący</option>
          </select></label>
      </div>
      <div id="gameSoundBox">
        <label class="switch-row"><input type="checkbox" id="gameSoundChk"><span data-i18n="gameSound">Dźwięk metronomu</span></label>
        <p class="game-hint" data-i18n="gameSoundHint"></p>
      </div>
      <button class="btn btn-primary game-btn" id="gameStartBtn" data-i18n="gameStart">Start</button>
      <p class="game-msg" id="gameMsg"></p>
    </div>

    <div class="game-stage" id="gameStage" hidden>
      <div class="game-status" id="gameStatus"></div>
      <div class="pendulum-track" id="gameTrack">
        <div class="pend-wall left"></div>
        <div class="pend-wall right"></div>
        <div class="pendulum-dot"></div>
      </div>
      <div class="game-counter" id="gameCounter"></div>
      <button class="btn btn-ghost game-btn" id="gameAbortBtn" data-i18n="gameStop">Przerwij</button>
    </div>

    <div class="game-result" id="gameResult" hidden>
      <div class="result-score" id="resultScore"></div>
      <div class="result-text" id="resultText"></div>
      <div class="chart" id="resultChart"></div>
      <div class="chart-legend" id="chartLegend"></div>
      <div class="nick-box" id="nickBox" hidden>
        <label for="nickInput" data-i18n="nickLabel">Twój nick</label>
        <input class="nick-input" id="nickInput" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false">
        <button class="btn btn-primary" id="nickSaveBtn" data-i18n="nickSave">Zapisz wynik</button>
      </div>
      <div class="result-text" id="nickNote"></div>
      <button class="btn btn-primary game-btn" id="playAgainBtn" data-i18n="playAgain">Zagraj ponownie</button>
    </div>

    <div class="board">
      <h4 class="board-title" id="boardTitle"></h4>
      <div id="boardList"></div>
      <div class="board-actions">
        <button class="btn btn-ghost" id="boardClearBtn" data-i18n="boardClear">Wyczyść tablicę</button>
        <div class="board-confirm" id="boardConfirm" hidden>
          <div data-i18n="boardConfirm"></div>
          <div class="board-confirm-btns">
            <button class="btn btn-danger" id="boardYesBtn" data-i18n="boardYes">Tak, usuń</button>
            <button class="btn btn-ghost" id="boardNoBtn" data-i18n="boardNo">Anuluj</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="pulse-overlay" id="pulseOverlay" aria-hidden="true"></div>

<script>
(function(){
  'use strict';

  /* ---------- Elements ---------- */
  const bpmNumber = document.getElementById('bpmNumber');
  const tempoLabel = document.getElementById('tempoLabel');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmMinus5 = document.getElementById('bpmMinus5');
  const bpmMinus1 = document.getElementById('bpmMinus1');
  const bpmPlus1 = document.getElementById('bpmPlus1');
  const bpmPlus5 = document.getElementById('bpmPlus5');
  const tapBtn = document.getElementById('tapBtn');
  const beatsPerBarSelect = document.getElementById('beatsPerBarSelect');
  const subdivisionSelect = document.getElementById('subdivisionSelect');
  const beatRow = document.getElementById('beatRow');
  const mainTrack = document.getElementById('mainTrack');
  const playBtn = document.getElementById('playBtn');
  const themeBtn = document.getElementById('themeBtn');
  const themePicker = document.getElementById('themePicker');

  /* ---------- i18n ---------- */
  const I18N = {
    pl: { title:'Metronom', beatsPerBar:'Uderzenia/takt', clicks:'Kliknięcia',
      beatAccent:'akcent', beatMuted:'wyciszone', beatNormal:'normalne uderzenie',
      beatAria:(n,label)=>`Uderzenie ${n}: ${label}. Kliknij, aby zmienić.`,
      gameTitle:'Gra rytmiczna', gameTempo:'Tempo', gameMode:'Tryb', modeAdv:'Zaawansowany', modeBeg:'Początkujący',
      gameSound:'Dźwięk metronomu',
      gameSoundHint:'Przy dźwięku z głośnika mikrofon może wyłapać sam metronom — najlepiej użyj słuchawek.',
      gameStart:'Start', gameStop:'Przerwij',
      gameCalib:'Cisza… kalibracja mikrofonu', gameListen:'Słuchaj rytmu…', gameClap:'Klaszcz!',
      gameClapAlong:'Klaszcz razem z pulsem!', gameNoClap:'Nie wykryto klaśnięcia', gameMicError:'Brak dostępu do mikrofonu',
      trendFast:(x)=>`Przyspieszasz o ${x}%`, trendSlow:(x)=>`Zwalniasz o ${x}%`, trendEven:'Trzymasz równe tempo',
      beginMsg:(even,ms)=>{
        const a = ms===null ? 0 : Math.abs(Math.round(ms));
        const off = ms!==null ? `ok. ${a} ms ${ms>0?'za późno':'za wcześnie'}` : '';
        return even ? (off ? `Klaszczesz równo, ale ${off}` : 'Klaszczesz równo i równo z pulsem')
                    : (off ? `Klaszczesz nierówno, średnio ${off}` : 'Klaszczesz nierówno'); },
      chartAria:'Wykres: idealna siatka rytmu i Twoje klaśnięcia',
      chartGrid:'siatka rytmu', chartPulses:'pulsy ekranu', chartClaps:'klaśnięcia',
      nickLabel:'Twój nick', nickSave:'Zapisz wynik', nickSaved:'Zapisano!', boardNoQual:'Ten wynik nie łapie się do top 10',
      boardTitle:(m,b)=>`Top 10 — ${m}, ${b} BPM`, boardEmpty:'Brak wyników', boardClear:'Wyczyść tablicę',
      boardConfirm:'Usunąć wszystkie wyniki (wszystkie tryby i tempa)?', boardYes:'Tak, usuń', boardNo:'Anuluj',
      playAgain:'Zagraj ponownie' },
    en: { title:'Metronome', beatsPerBar:'Beats/bar', clicks:'Clicks',
      beatAccent:'accent', beatMuted:'muted', beatNormal:'normal beat',

    if(b<=92) return 'Andante';

    if(b<=156) return 'Allegro';
    if(b<=176) return 'Vivace';
    if(b<=200) return 'Presto';

    if(tapTimes.length>8) tapTimes.shift();
    if(tapTimes.length>=2){
      const intervals=[];
      for(let i=1;i<tapTimes.length;i++) intervals.push(tapTimes[i]-tapTimes[i-1]);
      const avgMs = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      setBpm(60000/avgMs);

  /* ---------- Pendulum: ball flies along a thick line and bounces off a wall at each end ---------- */
  function restartAnim(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  /* ---------- Screen wake lock: keep the phone screen on while this page is open ---------- */
  let wakeLock = null;
  async function requestWakeLock(){
    try{

        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock=null; });

  /* ---------- Audio scheduler (lookahead technique for drift-free timing) ---------- */
  let audioCtx=null;
  let playing=false;
  let currentTick=0;      // index within the bar*subdivision cycle
  let nextNoteTime=0.0;   // audioCtx time of the next scheduled tick
  let timerID=null;
  let notesInQueue=[];    // {tick, time} pairs, drained by the visual draw loop
  const LOOKAHEAD_MS=25.0;
  const SCHEDULE_AHEAD=0.12; // seconds

  function ensureAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }

  // delay between scheduling a sound and hearing it (0 if the browser does not report it)
  function outLat(){
    return (audioCtx && typeof audioCtx.outputLatency==='number' && isFinite(audioCtx.outputLatency)) ? audioCtx.outputLatency : 0;
  }

  function totalTicks(){ return beatsPerBar*subdivision; }

  function scheduleClick(tick, time){
    const isMainBeat = (tick % subdivision === 0);
    const beatIndex = Math.floor(tick/subdivision);
    const state = beatStates[beatIndex] || 'normal';
    if(state!=='muted'){
      const isAccent = isMainBeat && state==='accent';
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = isAccent ? 1500 : (isMainBeat ? 1000 : 700);
      const peak = isAccent ? 0.9 : (isMainBeat ? 0.6 : 0.28);
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(peak, time+0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time+0.05);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time+0.06);
    }
    notesInQueue.push({ tick, time, main:isMainBeat, seq:isMainBeat ? beatSeq++ : -1 });
  }

  function advanceNote(){
    const secondsPerTick = (60.0/bpm)/subdivision;
    nextNoteTime += secondsPerTick;
    currentTick = (currentTick+1) % totalTicks();
  }

  function scheduler(){
    while(nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD){
      scheduleClick(currentTick, nextNoteTime);
      advanceNote();
    }

  function drawLoop(){
    if(!playing) return;
    // visual time = what is being heard right now (audio clock minus output latency)
    const t = audioCtx.currentTime - outLat();
    while(notesInQueue.length && notesInQueue[0].time <= t){
      const note = notesInQueue.shift();
      if(note.main){
        const beatIndex = Math.floor(note.tick/subdivision) % beatsPerBar;
        lightBeat(beatIndex);
        mainPend.hit(note.seq % 2);
        pendPrev = { time: note.time, seq: note.seq };
      }
    }
    if(pendPrev){
      // the ball reaches the opposite wall exactly at the next main beat
      let nextT = pendPrev.time + 60.0/bpm;
      for(const n of notesInQueue){ if(n.main){ nextT = n.time; break; } }
      const frac = Math.min(1, Math.max(0, (t - pendPrev.time) / (nextT - pendPrev.time)));
      mainPend.setX(pendPrev.seq % 2 === 0 ? frac : 1 - frac);
    }
    requestAnimationFrame(drawLoop);
  }

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }
  function devScore(dev, full, zero){
    const a = Math.abs(dev);
    if(a <= full) return 100;
    if(a >= zero) return 0;
    return 100*(zero-a)/(zero-full);
  }
  // Advanced: 10 intervals. The 1st is measured from the (heard) 8th beat T7h to the 1st clap,
  // the next 9 between consecutive claps. Each is compared with the beat length P.
  function scoreAdvanced(P, T7h, claps, cfg){
    const items = [];
    for(let k=0;k<cfg.SCORED;k++){
      if(k < claps.length){
        const prev = k===0 ? T7h : claps[k-1];
        const dev = (claps[k]-prev-P)/P;
        const score = k===0 ? devScore(dev, cfg.FIRST_FULL, cfg.FIRST_ZERO) : devScore(dev, cfg.INT_FULL, cfg.INT_ZERO);
        items.push({dev, score});
      } else {
        items.push({dev:null, score:0});   // missing clap = 0%
      }
    }
    const total = Math.round(mean(items.map(i=>i.score)));
    const devs = items.slice(1).filter(i=>i.dev!==null).map(i=>i.dev);   // tendency: intervals between claps only
    return { total, items, trend: devs.length ? mean(devs) : null };
  }
  // Beginner: pair each scored pulse with the nearest unused clap (within +-50% of the beat),
  // subtract the average shift and judge the evenness of what is left.
  function scoreBeginner(P, pulses, claps, cfg){
    const used = new Set();
    const matches = [];
    for(let j=cfg.WARM; j<cfg.WARM+cfg.SCORED && j<pulses.length; j++){
      let best=-1, bd=Infinity;
      for(let c=0;c<claps.length;c++){
        if(used.has(c)) continue;
        const d = Math.abs(claps[c]-pulses[j]);
        if(d < bd){ bd=d; best=c; }
      }
      if(best>=0 && bd <= 0.5*P){ used.add(best); matches.push({j, ci:best, off:claps[best]-pulses[j]}); }
      else matches.push({j, ci:-1, off:null});
    }
    const offs = matches.filter(m=>m.ci>=0).map(m=>m.off);
    const shift = mean(offs);
    const pairs = [];
    const scores = matches.map(m=>{
      if(m.ci < 0) return 0;
      const s = devScore((m.off-shift)/P, cfg.INT_FULL, cfg.INT_ZERO);
      pairs.push({gi:m.j, ci:m.ci, score:s});
      return s;
    });
    return { total: Math.round(mean(scores)), shift, pairs, matched: offs.length };
  }

  /* ----- clap detector: sample-accurate onset time from the analyser buffer ----- */
  function detReset(){
    det.ring.fill(0); det.wi=0; det.sumSq=0; det.mode='off'; det.armed=false; det.lastOnset=-1;
    det.listenFrom=Infinity; det.calMax=[];
  }
  function detFeed(now){
    if(!game.analyser) return;
    const N = game.analyser.fftSize;
    if(!det.buf || det.buf.length!==N) det.buf = new Float32Array(N);
    game.analyser.getFloatTimeDomainData(det.buf);
    let n = Math.round((now - det.last)*det.sr);
    det.last = now;
    if(n <= 0) return;
    if(n > N) n = N;
    let frameMax = 0;
    const W = GAME_CFG.RMS_WIN;
    for(let i=N-n; i<N; i++){
      const x = det.buf[i];
      const old = det.ring[det.wi];
      det.sumSq += x*x - old*old;
      det.ring[det.wi] = x;
      det.wi = (det.wi+1) % W;
      const rms = Math.sqrt(Math.max(det.sumSq,0)/W);
      if(det.mode==='calib'){ if(rms > frameMax) frameMax = rms; continue; }
      if(det.mode!=='listen') continue;
      const t = now - (N-1-i)/det.sr;      // time of this sample on the audio clock
      if(t < det.listenFrom) continue;
      if(!det.armed){
        if(rms < det.thr*GAME_CFG.REARM && t - det.lastOnset >= det.lock) det.armed = true;
      } else if(rms > det.thr){
        det.armed = false;
        det.lastOnset = t;
        onClap(t);
      }
    }
    if(det.mode==='calib') det.calMax.push(frameMax);
  }
  function onClap(t){
    if(game.phase!=='play') return;
    if(game.mode==='adv'){
      if(game.claps.length >= GAME_CFG.SCORED) return;
      game.claps.push(t);
      setCounter(game.claps.length, true);   // 1, 2, ... 10 (red)
    } else {
      game.claps.push(t);
    }
  }

  function gameClick(time, accent){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = accent ? 1500 : 1000;
    const peak = accent ? 0.9 : 0.6;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(peak, time+0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+0.05);
    osc.connect(gain).connect(game.bus);
    osc.start(time);
    osc.stop(time+0.06);
  }

    saveGameSettings();

    try{ await audioCtx.resume(); }catch(e){}

    if(!game.running){ stream.getTracks().forEach(t=>t.stop()); return; }   // aborted while the permission dialog was open
    game.stream = stream;
    game.src = audioCtx.createMediaStreamSource(stream);
    game.analyser = audioCtx.createAnalyser();
    game.analyser.fftSize = 4096;
    game.analyser.smoothingTimeConstant = 0;
    game.src.connect(game.analyser);
    detReset();
    det.sr = audioCtx.sampleRate;
    det.last = audioCtx.currentTime;
    det.mode = 'calib';
    game.calStart = audioCtx.currentTime;
    game.raf = requestAnimationFrame(gameFrame);
  }

  function finishCalibration(now){
    const arr = det.calMax.slice(3).sort((a,b)=>b-a);          // skip start-up frames, ignore one stray peak
    const noise = arr.length ? arr[Math.min(1, arr.length-1)] : 0;
    det.thr = clamp(noise*GAME_CFG.THR_MULT, GAME_CFG.THR_MIN, GAME_CFG.THR_MAX);
    det.lock = clamp(GAME_CFG.LOCK_FRAC*game.P, GAME_CFG.LOCK_MIN, GAME_CFG.LOCK_MAX);
    det.armed = false; det.lastOnset = -1;
    const adv = game.mode==='adv', P = game.P;
    game.bus = audioCtx.createGain();
    game.bus.connect(audioCtx.destination);
    game.T0 = now + GAME_CFG.LEAD_SEC;
    game.H = (adv || game.sound) ? outLat() : 0;       // delay between scheduling a click and hearing it
    game.nextBeat = 0; game.claps = []; game.pulseTimes = []; game.ballHidden = false;
    if(adv){
      for(let k=0;k<GAME_CFG.WARM;k++) gameClick(beatT(k), k===0);
      game.T7h = beatT(GAME_CFG.WARM-1) + game.H;                          // heard 8th beat
      det.listenFrom = beatT(GAME_CFG.WARM) + game.H - 0.5*P;               // half a beat before the expected 9th beat
      game.windowEnd = beatT(GAME_CFG.WARM) + game.H + 0.5*P;               // 1st clap accepted within +-50% of the beat
      game.deadline = game.T7h + GAME_CFG.TIMEOUT_MULT*GAME_CFG.SCORED*P;
      setStatus('gameListen');
    } else {
      const total = GAME_CFG.WARM + GAME_CFG.SCORED;
      if(game.sound) for(let k=0;k<total;k++) gameClick(beatT(k), k===0);
      det.listenFrom = beatT(0) - 0.5*P;                                    // microphone listens the whole round
      game.endAt = beatT(total-1) + 0.5*P;
      setStatus('gameClapAlong');
    }
    det.mode = 'listen';
    game.phase = 'play';
  }

  function playFrame(now){
    const adv = game.mode==='adv', P = game.P;
    const vis = now - visLat();                                              // what is being heard / seen right now
    const total = adv ? GAME_CFG.WARM : GAME_CFG.WARM + GAME_CFG.SCORED;
    while(game.nextBeat < total && vis >= beatT(game.nextBeat)){
      const k = game.nextBeat++;
      if(k < GAME_CFG.WARM) setCounter(GAME_CFG.WARM - k, false);   // 8 ... 1
      else setCounter(k - GAME_CFG.WARM + 1, true);                 // beginner test pulses: 1 ... 10 (red)
      gamePend.hit(k%2);
      if(adv){ if(k===total-1) setStatus('gameClap'); }
      else { game.pulseTimes.push(now); restartAnim(pulseOverlay, 'go'); }   // the real moment of the screen pulse
    }
    const prev = game.nextBeat - 1;
    if(prev < 0){
      gamePend.setX(0);
    } else if(prev >= total-1){
      gamePend.setX((total-1)%2===0 ? 0 : 1);
      if(adv && !game.ballHidden){ gamePend.show(false); game.ballHidden = true; }   // silence: the ball must not hint the rhythm
    } else {
      const frac = clamp((vis - beatT(prev))/P, 0, 1);
      gamePend.setX(prev%2===0 ? frac : 1-frac);
    }
    if(adv){
      if(game.claps.length >= GAME_CFG.SCORED || now > game.deadline || (game.claps.length===0 && now > game.windowEnd)) endRound();
    } else if(now > game.endAt){
      endRound();
    }
  }

  function gameFrame(){
    if(!game.running) return;
    const now = audioCtx.currentTime;
    detFeed(now);
    if(game.phase==='calib'){
      if(now - game.calStart >= GAME_CFG.CAL_SEC) finishCalibration(now);
    } else if(game.phase==='play'){
      playFrame(now);
    }
    if(game.running) game.raf = requestAnimationFrame(gameFrame);
  }

  function endRound(){
    if(!game.running) return;
    game.running = false;
    game.phase = 'ended';
    cancelAnimationFrame(game.raf);
    teardownMic();
    silenceBus();
    setStatus('');
    setTimeout(showResult, 450);       // let the last counter value be seen
  }
  function abortGame(){
    if(!game.running && game.phase!=='ended') return;
    game.running = false;
    game.phase = 'idle';
    cancelAnimationFrame(game.raf);
    teardownMic();
    silenceBus();
    setStatus(''); setCounter('');
    gamePend.setX(0); gamePend.show(true);
    showGameView('setup');
  }

  /* ----- result ----- */
  function showResult(){
    if(game.phase!=='ended') return;
    const P = game.P, adv = game.mode==='adv';
    let res;
    if(adv){
      if(!game.claps.length){
        res = { mode:'adv', noClap:true };
      } else {
        const s = scoreAdvanced(P, game.T7h, game.claps, GAME_CFG);
        const grid = [];                       // only the 10 test marks (the warm-up is not shown)
        for(let k=0;k<GAME_CFG.SCORED;k++) grid.push({ t:beatT(GAME_CFG.WARM+k)+game.H });
        const pairs = [];
        s.items.forEach((it,k)=>{ if(it.dev!==null) pairs.push({ gi:k, ci:k, score:it.score }); });
        res = { mode:'adv', noClap:false, score:s.total, trend:s.trend,
                chart:{ grid, claps:game.claps.slice(), pairs, topKey:'chartGrid' } };
      }
    } else {
      // beginner: only claps from the test part (from half a beat before the 9th pulse) are shown
      const cut = game.pulseTimes[GAME_CFG.WARM] - 0.5*P;
      const map = {}, claps = [];
      game.claps.forEach((t,i)=>{ if(t >= cut){ map[i] = claps.length; claps.push(t); } });
      if(!claps.length){
        res = { mode:'beg', noClap:true };
      } else {
        const s = scoreBeginner(P, game.pulseTimes, game.claps, GAME_CFG);
        const grid = game.pulseTimes.slice(GAME_CFG.WARM).map(t=>({ t }));
        const pairs = s.pairs.filter(p=>map[p.ci]!==undefined).map(p=>({ gi:p.gi-GAME_CFG.WARM, ci:map[p.ci], score:p.score }));
        res = { mode:'beg', noClap:false, score:s.total, shiftMs:s.shift*1000, matched:s.matched,
                chart:{ grid, claps, pairs, topKey:'chartPulses' } };
      }
    }
    game.result = res;
    game.phase = 'result';
    showGameView('result');
    renderResult();
    setupNick(res);
  }

  function pairColor(score){
    return score >= GAME_CFG.GOOD ? 'var(--ok)' : (score >= GAME_CFG.OK ? 'var(--warn)' : 'var(--bad)');
  }
  function chartSVG(c){
    const W=520, H=150, pad=14, yTop=36, yBot=114;
    const all = c.grid.map(g=>g.t).concat(c.claps);
    const t0 = Math.min.apply(null, all), t1 = Math.max.apply(null, all);
    const span = Math.max(t1-t0, 0.001);
    const X = t => (pad + (t-t0)/span*(W-2*pad)).toFixed(1);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr().chartAria}">`;
    s += `<line x1="${pad}" x2="${W-pad}" y1="${yTop}" y2="${yTop}" style="stroke:var(--panel-2);stroke-width:2"/>`;
    s += `<line x1="${pad}" x2="${W-pad}" y1="${yBot}" y2="${yBot}" style="stroke:var(--panel-2);stroke-width:2"/>`;
    c.pairs.forEach(p=>{
      s += `<line x1="${X(c.grid[p.gi].t)}" y1="${yTop+13}" x2="${X(c.claps[p.ci])}" y2="${yBot-8}" style="stroke:${pairColor(p.score)};stroke-width:1.6;opacity:.9"/>`;
    });
    c.grid.forEach(g=>{
      s += `<rect x="${(X(g.t)-2.5).toFixed(1)}" y="${yTop-12}" width="5" height="24" rx="1" style="fill:var(--gold)"/>`;
    });
    c.claps.forEach(t=>{ s += `<circle cx="${X(t)}" cy="${yBot}" r="6" style="fill:var(--ink)"/>`; });
    return s + '</svg>';
  }
  function legendItem(cls, text){
    const span = document.createElement('span'); span.className = 'lg';
    const i = document.createElement('i'); i.className = cls;
    span.appendChild(i); span.appendChild(document.createTextNode(text));
    return span;
  }
  function renderResult(){
    const r = game.result;
    if(!r) return;
    resultScore.hidden = r.noClap;
    resultScore.textContent = '';
    if(!r.noClap){
      const pct = document.createElement('span');
      pct.textContent = r.score + '%';
      resultScore.appendChild(pct);
      const e = emojiForScore(r.score);
      if(e==='trophy'){
        const img = document.createElement('img');
        img.className = 'result-trophy'; img.src = TROPHY_SRC; img.alt = ''; img.setAttribute('aria-hidden','true');
        resultScore.appendChild(img);
      } else {
        const em = document.createElement('span');
        em.className = 'result-emoji'; em.textContent = e; em.setAttribute('aria-hidden','true');
        resultScore.appendChild(em);
      }
    }
    let txt = '';
    if(r.noClap){
      txt = tr().gameNoClap;
    } else if(r.mode==='adv'){
      if(r.trend !== null){
        const x = Math.round(Math.abs(r.trend)*100);
        if(Math.abs(r.trend) < GAME_CFG.TREND_EVEN || x===0) txt = tr().trendEven;
        else txt = r.trend < 0 ? tr().trendFast(x) : tr().trendSlow(x);   // shorter intervals = speeding up
      }
    } else {
      const note = Math.abs(r.shiftMs) >= GAME_CFG.OFFSET_NOTE_MS ? r.shiftMs : null;   // + = late
      txt = tr().beginMsg(r.score >= GAME_CFG.EVEN_SCORE, note);
    }
    resultText.textContent = txt;
    resultChart.hidden = r.noClap;
    chartLegend.hidden = r.noClap;
    resultChart.innerHTML = '';
    chartLegend.innerHTML = '';
    if(!r.noClap){
      resultChart.innerHTML = chartSVG(r.chart);
      chartLegend.appendChild(legendItem('t-grid', tr()[r.chart.topKey]));
      chartLegend.appendChild(legendItem('t-clap', tr().chartClaps));
    }
  }

  /* ----- nick + leaderboard ----- */
  function updateNickBtn(){ nickSaveBtn.disabled = !cleanNick(nickInput.value) || game.savedThisRound; }
  function setupNick(res){
    nickBox.hidden = true;
    setNote('');
    if(res.noClap || !(res.score > 0)) return;
    if(qualifies(res.mode, game.tempo, res.score)){
      let nick = '';
      try{ nick = cleanNick(localStorage.getItem(NICK_KEY)); }catch(e){}
      nickInput.value = nick;
      nickBox.hidden = false;
      updateNickBtn();
    } else {
      setNote('boardNoQual');
    }
  }
  nickInput.addEventListener('input', updateNickBtn);
  nickSaveBtn.addEventListener('click', ()=>{
    const r = game.result;
    const nick = cleanNick(nickInput.value);
    if(!r || r.noClap || !nick || game.savedThisRound) return;
    game.savedThisRound = true;
    try{ localStorage.setItem(NICK_KEY, nick); }catch(e){}
    const d = Date.now();
    addScore(r.mode, game.tempo, { n:nick, s:r.score, d });
    game.lastSavedD = d;
    nickBox.hidden = true;
    setNote('nickSaved');
    renderBoard();
  });

  function renderBoard(){
    const mode = gameModeSelect.value==='adv' ? 'adv' : 'beg';
    const tempo = parseInt(gameTempoSelect.value,10);
    boardTitle.textContent = tr().boardTitle(mode==='adv' ? tr().modeAdv : tr().modeBeg, tempo);
    const list = getList(mode, tempo);
    boardList.innerHTML = '';
    if(!list.length){
      const e = document.createElement('div'); e.className = 'board-empty'; e.textContent = tr().boardEmpty;
      boardList.appendChild(e);
      return;
    }
    list.forEach((e,i)=>{
      const row = document.createElement('div');
      row.className = 'board-row' + (e.d && e.d===game.lastSavedD ? ' me' : '');
      const rank = document.createElement('span'); rank.className = 'board-rank'; rank.textContent = (i+1)+'.';
      const nick = document.createElement('span'); nick.className = 'board-nick'; nick.textContent = e.n;   // textContent: nick is never parsed as HTML
      const sc = document.createElement('span'); sc.className = 'board-score'; sc.textContent = e.s + '%';
      row.appendChild(rank); row.appendChild(nick); row.appendChild(sc);
      boardList.appendChild(row);
    });
  }
  boardClearBtn.addEventListener('click', ()=>{ boardClearBtn.hidden = true; boardConfirm.hidden = false; });
  boardNoBtn.addEventListener('click', ()=>{ boardConfirm.hidden = true; boardClearBtn.hidden = false; });
  boardYesBtn.addEventListener('click', ()=>{
    try{ localStorage.removeItem(BOARD_KEY); }catch(e){}
    game.lastSavedD = 0;
    boardConfirm.hidden = true; boardClearBtn.hidden = false;
    renderBoard();
  });

  /* ----- setup controls ----- */
  function saveGameSettings(){
    saveJSON(GAME_KEY, { tempo:parseInt(gameTempoSelect.value,10), mode:gameModeSelect.value, sound:gameSoundChk.checked });
  }
  for(let b=GAME_CFG.TEMPO_MIN; b<=GAME_CFG.TEMPO_MAX; b+=GAME_CFG.TEMPO_STEP){
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b + ' BPM';
    gameTempoSelect.appendChild(opt);
  }
  (function loadGameSettings(){
    const s = loadJSON(GAME_KEY);
    gameTempoSelect.value = '80';
    gameModeSelect.value = 'beg';
    if(s && typeof s==='object'){
      if(s.tempo>=GAME_CFG.TEMPO_MIN && s.tempo<=GAME_CFG.TEMPO_MAX && s.tempo%GAME_CFG.TEMPO_STEP===0) gameTempoSelect.value = String(s.tempo);
      if(s.mode==='adv' || s.mode==='beg') gameModeSelect.value = s.mode;
      gameSoundChk.checked = s.sound===true;        // default: sound off
    }
  })();
  function refreshSetup(){
    gameSoundBox.hidden = gameModeSelect.value!=='beg';   // the sound switch only makes sense in beginner mode
    renderBoard();
  }
  gameTempoSelect.addEventListener('change', ()=>{ saveGameSettings(); refreshSetup(); });
  gameModeSelect.addEventListener('change', ()=>{ saveGameSettings(); refreshSetup(); });
  gameSoundChk.addEventListener('change', saveGameSettings);
  gameStartBtn.addEventListener('click', startGame);
  gameAbortBtn.addEventListener('click', abortGame);
  playAgainBtn.addEventListener('click', ()=>{ game.phase = 'idle'; showGameView('setup'); setNote(''); setMsg(''); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) abortGame(); });   // timing is meaningless in the background
  refreshSetup();

  function refreshGameTexts(){
    setStatus(game.statusKey);
    setMsg(game.msgKey);
    setNote(game.noteKey);
    renderBoard();
    if(game.phase==='result') renderResult();
  }

  /* ---------- App shell integration (added for merged app) ---------- */
  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'app:theme'){
      const t = THEMES.find(x=>x.id===d.themeId);
      if(t) applyTheme(t);
    }
    if(d.type === 'app:pause'){
      if(playing) stopMetronome();
      abortGame();
      releaseWakeLock();
    }
    if(d.type === 'app:resume'){
      requestWakeLock();
    }
    if(d.type === 'app:lang' && (['pl','en','de','fr','es','pt'].includes(d.value))){
      currentLang = d.value;
      try{ localStorage.setItem('appLangV1', currentLang); }catch(e){}
      applyI18n();
    }
  });
  applyI18n(); // apply whatever language was already stored, in case it's not the default
})();
</script>
